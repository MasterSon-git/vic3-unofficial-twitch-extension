<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Unofficial Victoria 3 Overlay - Config</title>
  <style>
    :root {
      --bg: #fff;
      --text: #232127;
      --muted: #666666;
      --link: #6441a4;
      --card: #ffffff;
      --card-border: #dddddd;
      --button-bg: #111111;
      --button-text: #ffffff;
    }
    .dark {
      --bg: #201c2b;
      --text: #e5e3e8;
      --muted: #adadb8;
      --link: #e2dbf0;
      --card: #1f1f23;
      --card-border: #303030;
      --button-bg: #9146ff;
      --button-text: #ffffff;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      margin: 0;
      padding: 0;
    }
    .card {
      max-width: 560px;
      padding: 1rem 1.25rem;
      border: 1px solid var(--card-border);
      border-radius: 12px;
      background: var(--card);
    }
    button {
      padding: .6rem 1rem;
      border-radius: 8px;
      border: 1px solid transparent;
      background: var(--button-bg);
      color: var(--button-text);
      cursor: pointer;
    }
    button[disabled] {
      opacity: .6;
      cursor: not-allowed;
    }
    a {
      color: var(--link);
      text-decoration: none;
    }
    .muted {
      color: var(--muted);
    }
    .row {
      display: flex;
      gap: .75rem;
      align-items: center;
      margin: 1rem 0;
    }
    .state {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      min-height: 1.5rem;
      font-weight: 600;
    }
    .state::before {
      content: "";
      width: .55rem;
      height: .55rem;
      border-radius: 999px;
      background: var(--muted);
    }
    .state.paired::before {
      background: #16833a;
    }
    .state.unpaired::before {
      background: #b7791f;
    }
    .state.error::before {
      background: #b91c1c;
    }
    .code {
      font: 600 22px ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      letter-spacing: .15em;
    }
  </style>

  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script>
    Twitch.ext.onContext((ctx) => {
      document.documentElement.classList.toggle('dark', ctx.theme === 'dark');
    });

    document.documentElement.classList.toggle('dark',
      window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
    );
  </script>
</head>
<body>
  <div class="card">
    <h2>Unofficial Victoria 3 Overlay - Configuration</h2>
    <p class="muted">Click "Generate code" to pair your desktop uploader with this channel.</p>
    <div class="row">
      <button id="gen" disabled>Generate code</button>
      <button id="unpair" disabled>Unpair</button>
      <div id="status" class="muted"></div>
    </div>
    <div id="out" class="code"></div>
    <p class="muted" id="hint"></p>
  </div>

  <script>
    let auth = null;
    const workerBase = "https://vic3-unofficial-twitch-ebs.masterharz-ss.workers.dev";

    const genBtn = document.getElementById('gen');
    const unpairBtn = document.getElementById('unpair');
    const out = document.getElementById('out');
    const statusEl = document.getElementById('status');
    const hint = document.getElementById('hint');
    let statusTimer = null;
    let codePollTimer = null;

    function setStatus(text, state) {
      statusEl.textContent = text;
      statusEl.className = `state ${state || ""}`.trim();
    }

    function setHint(text) {
      hint.textContent = text;
    }

    function showCode(code, ttl) {
      out.textContent = code;
      setHint(`Valid for ${Math.round(ttl / 60)} minutes. Enter this code in the desktop app.`);
    }

    function authHeaders() {
      return {
        "Authorization": `Bearer ${auth.token}`,
        "Content-Type": "application/json"
      };
    }

    function channelBody() {
      return JSON.stringify({ channelId: auth.channelId });
    }

    function stopCodePolling() {
      if (codePollTimer) clearInterval(codePollTimer);
      codePollTimer = null;
    }

    function renderPairStatus(data) {
      if (data.paired) {
        stopCodePolling();
        out.textContent = "";
        genBtn.textContent = "Generate new code";
        unpairBtn.disabled = false;
        setStatus("Paired", "paired");
        setHint(data.pairedAt ? `Desktop uploader paired at ${new Date(data.pairedAt).toLocaleString()}.` : "Desktop uploader is paired.");
      } else {
        genBtn.textContent = "Generate code";
        unpairBtn.disabled = true;
        setStatus("Not paired", "unpaired");
        if (!out.textContent) setHint("Generate a code and enter it in the desktop app.");
      }
    }

    async function refreshPairStatus() {
      if (!auth) return false;
      const res = await fetch(`${workerBase}/pair/status`, {
        method: "POST",
        headers: authHeaders(),
        body: channelBody()
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
      renderPairStatus(data);
      return Boolean(data.paired);
    }

    function startStatusPolling() {
      if (statusTimer) clearInterval(statusTimer);
      statusTimer = setInterval(() => {
        refreshPairStatus().catch(e => setStatus(`Error: ${e.message || e}`, "error"));
      }, 30000);
    }

    function startCodePolling(ttl) {
      stopCodePolling();
      const stopAt = Date.now() + (ttl * 1000);
      codePollTimer = setInterval(async () => {
        if (Date.now() >= stopAt) {
          stopCodePolling();
          return;
        }
        try {
          await refreshPairStatus();
        } catch (e) {
          setStatus(`Error: ${e.message || e}`, "error");
        }
      }, 2000);
    }

    Twitch.ext.onAuthorized(async a => {
      auth = a;
      genBtn.disabled = false;
      setStatus("Checking...", "");
      try {
        await refreshPairStatus();
        startStatusPolling();
      } catch (e) {
        setStatus(`Error: ${e.message || e}`, "error");
      }
    });

    genBtn.addEventListener('click', async () => {
      if (!auth) return;
      genBtn.disabled = true;
      setStatus("Generating...");
      try {
        const res = await fetch(`${workerBase}/pair/init`, {
          method: "POST",
          headers: authHeaders(),
          body: channelBody()
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
        showCode(data.code, data.expiresIn || 600);
        setStatus("Code generated");
        startCodePolling(data.expiresIn || 600);
      } catch (e) {
        setStatus(`Error: ${e.message || e}`, "error");
        out.textContent = "";
        setHint("");
      } finally {
        genBtn.disabled = false;
      }
    });

    unpairBtn.addEventListener('click', async () => {
      if (!auth) return;
      unpairBtn.disabled = true;
      setStatus("Unpairing...");
      try {
        const res = await fetch(`${workerBase}/pair/revoke/channel`, {
          method: "POST",
          headers: authHeaders(),
          body: channelBody()
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(data?.error || `HTTP ${res.status}`);
        out.textContent = "";
        stopCodePolling();
        await refreshPairStatus();
      } catch (e) {
        setStatus(`Error: ${e.message || e}`, "error");
        unpairBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
